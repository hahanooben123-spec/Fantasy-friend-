name: iOS validation
on: [push, pull_request, workflow_dispatch]
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check project integrity
        run: python3 tools/check_project.py
      - name: Build with Swift 6
        run: xcodebuild -project FantasiVen.xcodeproj -scheme FantasiVen -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Select installed iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(d['udid'] for devices in data['devices'].values() for d in devices if d['name'].startswith('iPhone')))")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run persistence and model tests
        run: xcodebuild -project FantasiVen.xcodeproj -scheme FantasiVen -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: TestResults.xcresult
