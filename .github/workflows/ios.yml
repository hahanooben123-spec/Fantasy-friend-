name: iOS validation
on:
  push:
    paths:
      - 'FantasiVen.swiftpm/**'
      - 'FantasiVen.xcodeproj/**'
      - 'Configuration/**'
      - 'Tests/**'
      - 'tools/check_project.py'
  pull_request:
    paths:
      - 'FantasiVen.swiftpm/**'
      - 'FantasiVen.xcodeproj/**'
      - 'Configuration/**'
      - 'Tests/**'
      - 'tools/check_project.py'
  workflow_dispatch:
    inputs:
      screenshots_only:
        description: 'Build and capture UI without repeating the test suite'
        type: boolean
        default: false
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check project integrity
        if: github.event.inputs.screenshots_only != 'true'
        run: python3 tools/check_project.py
      - name: Build with Swift 6
        run: xcodebuild -project FantasiVen.xcodeproj -scheme FantasiVen -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Select installed iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(d['udid'] for devices in data['devices'].values() for d in devices if d['name'].startswith('iPhone')))")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run persistence and model tests
        if: github.event.inputs.screenshots_only != 'true'
        run: xcodebuild -project FantasiVen.xcodeproj -scheme FantasiVen -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult test
      - name: Capture immersive iPad play
        timeout-minutes: 4
        continue-on-error: true
        run: |
          mkdir -p ui-previews
          xcrun simctl shutdown all || true
          IPAD_ID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(d['udid'] for devices in data['devices'].values() for d in devices if d['name'].startswith('iPad')))")
          xcrun simctl boot "$IPAD_ID" || true
          xcrun simctl bootstatus "$IPAD_ID" -b
          xcrun simctl install "$IPAD_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/FantasiVen.app
          xcrun simctl status_bar "$IPAD_ID" override --time "9:41" --batteryState charged --batteryLevel 100
          for ROUTE in hub kitchen bubbles orchestra playground; do
            xcrun simctl launch --terminate-running-process "$IPAD_ID" dk.fantasiven.app "--preview-play=$ROUTE"
            sleep 3
            xcrun simctl io "$IPAD_ID" screenshot "ui-previews/$ROUTE-iPad.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: ui-previews/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.screenshots_only != 'true'
        with:
          name: iOS-test-results
          path: TestResults.xcresult
